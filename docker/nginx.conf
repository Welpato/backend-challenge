# Balanceador round-robin na frente das réplicas `api` (deploy.replicas no compose).
# `server api:3000 resolve` + `resolver` do Docker: o nginx re-resolve o nome periodicamente e
# distribui entre todos os IPs das réplicas (inclusive as recriadas). Requer nginx >= 1.27.3.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;

  upstream api {
    zone api_upstream 64k;
    server api:3000 resolve;
    keepalive 32;
  }

  server {
    listen 8080;

    location = /nginx-health {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      # Só repete em outra réplica se a conexão falhar; POST nunca é repetido pelo nginx
      # (non_idempotent fora da lista) — a idempotência é do serviço, não do balanceador.
      proxy_next_upstream error timeout;
    }
  }
}
